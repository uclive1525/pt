services:
  mt-pt:
    image: mt-pt:1.0.7
    container_name: mt-pt
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    environment:
      - TZ=Asia/Shanghai
      - APP_VERSION=1.0.7
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/version', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
